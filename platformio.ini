; All active settings live in platformio_user.ini (gitignored).
; Copy platformio_user.ini.example → platformio_user.ini and fill in your credentials.
[platformio]
extra_configs = platformio_user.ini
default_envs  = esp32-c6-devkitm-1

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf

build_flags =
    -std=gnu++2a
    -Wall
    -Wextra
    ${private_credentials.build_flags}
    
monitor_speed = 115200

; Native environment for host-side unit tests — pio test -e native (NOT pio run)
[env:native]
platform = native
targets  = test
build_flags =
    -std=c++2a
    -Wall
    -Wextra
    -DNATIVE_ENV
build_src_filter = 
    -<*> 
    +<display/matrix.cpp> 
    +<display/ldr.cpp>
    +<display/renderer.cpp>
test_build_src = yes
