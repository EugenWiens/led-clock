;
; All active device settings live in platformio_user.ini (gitignored).
; Create platformio_user.ini and fill in [private_credentials] as documented in README.md.
[platformio]
extra_configs = platformio_user.ini
default_envs  = esp32-c6-devkitm-1

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf
board_build.partitions = partitions.csv

build_flags =
    -std=gnu++2a
    -Wall
    -Wextra
    -Werror
    -Isrc
    -I.
    ${private_credentials.build_flags}
    
monitor_speed = 115200

; Native environment for host-side unit tests — pio test -e native (NOT pio run)
[env:native]
platform = native
targets  = test
build_flags =
    -std=c++2a
    -Wall
    -Wextra
    -Werror
    -DNATIVE_ENV
    -Isrc
    -I.
build_src_filter =
    -<*>
    +<display/Matrix.cpp>
    +<display/Ldr.cpp>
    +<display/Renderer.cpp>
    +<display/Display.cpp>
    +<ble/SwitchBot.cpp>
test_build_src = yes

; Coverage variant — same as native but with gcov instrumentation (QA-13)
[env:native_coverage]
platform = native
targets  = test
build_flags =
    -std=c++2a
    -Wall
    -Wextra
    -Werror
    -DNATIVE_ENV
    -Isrc
    -I.
    -fprofile-arcs
    -ftest-coverage
    -lgcov
build_src_filter =
    -<*>
    +<display/Matrix.cpp>
    +<display/Ldr.cpp>
    +<display/Renderer.cpp>
    +<display/Display.cpp>
    +<ble/SwitchBot.cpp>
test_build_src = yes
